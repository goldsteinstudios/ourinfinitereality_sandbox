<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tao Te Ching Structural Translation Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            gap: 20px;
            height: calc(100vh - 200px);
        }
        
        .sidebar {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        
        .content {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        
        .mapping-section {
            margin-bottom: 25px;
            padding: 15px;
            background: #333;
            border-radius: 6px;
            border-left: 4px solid #4a9eff;
        }
        
        .mapping-item {
            display: grid;
            grid-template-columns: 50px 80px 1fr 30px;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            background: #3a3a3a;
            border-radius: 4px;
        }
        
        .chinese-char {
            font-size: 18px;
            font-weight: bold;
            color: #4a9eff;
            text-align: center;
        }
        
        .pinyin-input {
            background: #2a2a2a;
            border: 1px solid #555;
            color: #ffa500;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .mapping-input {
            background: #2a2a2a;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 6px 10px;
            border-radius: 4px;
        }
        
        .chapter-selector {
            margin-bottom: 20px;
        }
        
        .chapter-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        
        .chapter-btn {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 8px 12px;
            margin: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chapter-btn:hover {
            background: #4a9eff;
        }
        
        .chapter-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
        }
        
        .edit-toggle {
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .edit-toggle.active {
            background: #51cf66;
        }
        
        .translation-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .text-panel {
            background: #333;
            padding: 20px;
            border-radius: 6px;
        }
        
        .original-panel {
            border-left: 4px solid #4a9eff;
        }
        
        .structural-panel {
            border-left: 4px solid #51cf66;
        }
        
        .text-panel h3 {
            margin-top: 0;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .version-selector {
            background: #2a2a2a;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .line-container {
            margin: 15px 0;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 3px solid #555;
        }
        
        .chinese-line {
            font-size: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .chinese-line.editable {
            background: #333;
            border: 1px solid #666;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }
        
        .pinyin-line {
            font-size: 14px;
            color: #ffa500;
            font-style: italic;
            margin-bottom: 8px;
        }
        
        .pinyin-line.editable {
            background: #333;
            border: 1px solid #666;
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
        }
        
        .english-line {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 8px;
        }
        
        .structural-line {
            font-size: 16px;
            color: #51cf66;
            line-height: 1.4;
        }
        
        .structural-line.editable {
            background: #333;
            border: 1px solid #666;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }
        
        .highlighted-char {
            background: #4a9eff;
            color: #000;
            padding: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        
        .char-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        
        .highlighted-char:hover .char-tooltip {
            opacity: 1;
        }
        
        .export-btn, .import-btn, .add-btn, .delete-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .export-btn {
            background: #51cf66;
            color: #000;
        }
        
        .import-btn {
            background: #ff6b6b;
            color: #fff;
        }
        
        .add-btn {
            background: #4a9eff;
            color: #fff;
        }
        
        .delete-btn {
            background: #ff6b6b;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
        }
        
        .file-input {
            display: none;
        }
        
        .search-box {
            width: 100%;
            background: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .add-mapping-form {
            display: grid;
            grid-template-columns: 50px 80px 1fr 60px;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        
        .chapter-management {
            background: #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        
        .new-chapter-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .lexicon-panel {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        
        .lexicon-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .lexicon-stats {
            color: #888;
            font-size: 12px;
            margin-bottom: 15px;
        }
        
        .lexicon-item {
            margin-bottom: 12px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
            border-left: 3px solid #4a9eff;
        }
        
        .lexicon-char {
            font-size: 20px;
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 4px;
        }
        
        .lexicon-pinyin {
            font-size: 12px;
            color: #ffa500;
            margin-bottom: 6px;
        }
        
        .lexicon-meaning {
            font-size: 13px;
            color: #e0e0e0;
            line-height: 1.3;
        }
        
        .lexicon-frequency {
            font-size: 11px;
            color: #888;
            text-align: right;
            margin-top: 4px;
        }
        
        .auto-translation {
            background: #1a4a1a;
            border-left-color: #51cf66;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tao Te Ching Structural Translation Tool</h1>
            <p>Interactive Rosetta Stone for Recursive Structural Mappings</p>
        </div>
        
        <div class="main-grid">
            <div class="sidebar">
                <div class="mapping-section">
                    <h3>Character Mappings</h3>
                    <input type="text" class="search-box" placeholder="Search characters..." id="charSearch">
                    <div id="mappingsList"></div>
                    
                    <div class="add-mapping-form">
                        <input type="text" id="newChar" placeholder="字" class="chinese-char" style="background: #2a2a2a; border: 1px solid #555; width: 40px;">
                        <input type="text" id="newPinyin" placeholder="pīnyīn" class="pinyin-input">
                        <input type="text" id="newMapping" placeholder="Structural meaning..." class="mapping-input">
                        <button class="add-btn" onclick="addMapping()">Add</button>
                    </div>
                    
                    <button class="export-btn" onclick="exportMappings()">Export Mappings</button>
                    <button class="import-btn" onclick="document.getElementById('fileInput').click()">Import Mappings</button>
                    <input type="file" id="fileInput" class="file-input" accept=".json" onchange="importMappings(event)">
                </div>
            </div>
            
            <div class="content">
                <div class="chapter-management">
                    <h3>Chapter Management</h3>
                    <div class="chapter-controls">
                        <span>Chapters:</span>
                        <div id="chapterButtons"></div>
                        <button class="edit-toggle" id="editToggle" onclick="toggleEditMode()">Edit Mode</button>
                    </div>
                    <div class="new-chapter-form">
                        <input type="number" id="newChapterNum" placeholder="42" class="new-chapter-input">
                        <button class="add-btn" onclick="addNewChapter()">Add Chapter</button>
                        <button class="delete-btn" onclick="deleteCurrentChapter()">Delete Current</button>
                    </div>
                </div>
                
                <div class="translation-display">
                    <div class="text-panel original-panel">
                        <h3>
                            Original Text
                            <select class="version-selector" id="versionSelector" onchange="switchVersion()">
                                <option value="traditional">Traditional</option>
                                <option value="simplified">Simplified</option>
                                <option value="classical">Classical</option>
                            </select>
                        </h3>
                        <div id="originalText"></div>
                    </div>
                    
                    <div class="text-panel structural-panel">
                        <h3>Structural Translation</h3>
                        <div id="structuralText"></div>
                    </div>
                </div>
            </div>
            
            <div class="lexicon-panel">
                <div class="mapping-section">
                    <h3>Running Lexicon</h3>
                    <div class="lexicon-controls">
                        <button class="add-btn" onclick="toggleLexiconMode()">
                            <span id="lexiconModeText">Auto Mode</span>
                        </button>
                        <button class="export-btn" onclick="exportLexicon()">Export</button>
                    </div>
                    <div class="lexicon-stats">
                        <span id="lexiconStats">0 characters</span>
                    </div>
                    <div id="lexiconList"></div>
                </div>
            </div>
        </div>
    </div>

        // Character mappings with pinyin

            '強': { pinyin: 'qiáng', meaning: 'Rigid/Forced (breaks recursion)' },

        // Chapter data with multiple versions and pinyin
        const chapters = {

                        ],
                        pinyin: [

                            'Míng kě míng, fēi cháng míng.',

                            'Xuán zhī yòu xuán, zhòng miào zhī mén.'

                    },

                        ],
                        pinyin: [

                            'Míng kě míng, fēi héng míng.',

                            '此兩者同出而異名，',

                        ],

            2: {

                    'Long and short give each other form,',

                    'Tone and voice resonate through turning,',

            },
            42: {
                versions: {
                    traditional: {
                        chinese: [
                            '道生一，',
                            '一生二，',
                            '二生三，',
                            '三生萬物。',
                            '萬物負陰而抱陽，',
                            '沖氣以為和。'
                        ],
                        pinyin: [
                            'Dào shēng yī,',
                            'Yī shēng èr,',
                            'Èr shēng sān,',
                            'Sān shēng wàn wù.',
                            'Wàn wù fù yīn ér bào yáng,',
                            'Chōng qì yǐ wéi hé.'
                        ]
                    }
                },
                structural: [
                    'Paradox generates contrast gradient,',
                    'Contrast demands balance axis,',
                    'Balance necessitates structural turning,',
                    'Turning gives rise to recursive forms.',
                    'All forms hold inward/outward gradients,',
                    'Rotating paradox creates coherence.'
                ]
            }
        };

        let currentChapter = 1;
        let currentVersion = 'traditional';
        let isEditMode = false;
        let lexiconMode = 'auto'; // 'auto' or 'manual'
        let chapterLexicon = {}; // Characters found in current chapter

        function initializeApp() {
            renderChapterButtons();
            renderMappingsList();
            renderCurrentChapter();
            updateLexicon();
        }

        function renderChapterButtons() {
            const container = document.getElementById('chapterButtons');
            container.innerHTML = '';
            
            Object.keys(chapters).sort((a, b) => parseInt(a) - parseInt(b)).forEach(chapterNum => {
                const btn = document.createElement('button');
                btn.className = `chapter-btn ${chapterNum == currentChapter ? 'active' : ''}`;
                btn.textContent = chapterNum;
                btn.onclick = () => selectChapter(chapterNum);
                container.appendChild(btn);
            });
        }

        function selectChapter(chapterNum) {
            currentChapter = chapterNum;
            renderChapterButtons();
            renderCurrentChapter();
            updateLexicon();
        }

        function switchVersion() {
            currentVersion = document.getElementById('versionSelector').value;
            renderCurrentChapter();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editToggle');
            btn.textContent = isEditMode ? 'View Mode' : 'Edit Mode';
            btn.className = `edit-toggle ${isEditMode ? 'active' : ''}`;
            renderCurrentChapter();
        }

        function renderMappingsList() {
            const container = document.getElementById('mappingsList');
            container.innerHTML = '';
            
            Object.entries(characterMappings).forEach(([char, data]) => {
                const item = document.createElement('div');
                item.className = 'mapping-item';
                item.innerHTML = `
                    <div class="chinese-char">${char}</div>
                    <input type="text" class="pinyin-input" value="${data.pinyin || ''}" 
                           onchange="updateMappingPinyin('${char}', this.value)">
                    <input type="text" class="mapping-input" value="${data.meaning || ''}" 
                           onchange="updateMappingMeaning('${char}', this.value)">
                    <button class="delete-btn" onclick="deleteMapping('${char}')">×</button>
                `;
                container.appendChild(item);
            });
        }

        function renderCurrentChapter() {
            const chapter = chapters[currentChapter];
            if (!chapter) return;
            
            const version = chapter.versions[currentVersion] || chapter.versions.traditional || chapter.versions[Object.keys(chapter.versions)[0]];
            
            const originalContainer = document.getElementById('originalText');
            const structuralContainer = document.getElementById('structuralText');
            
            originalContainer.innerHTML = '';
            structuralContainer.innerHTML = '';
            
            version.chinese.forEach((line, index) => {
                const lineContainer = document.createElement('div');
                lineContainer.className = 'line-container';
                
                // Chinese text
                const chineseDiv = document.createElement('div');
                chineseDiv.className = `chinese-line ${isEditMode ? 'editable' : ''}`;
                if (isEditMode) {
                    chineseDiv.contentEditable = true;
                    chineseDiv.textContent = line;
                    chineseDiv.onblur = () => updateChapterLine('chinese', index, chineseDiv.textContent);
                } else {
                    chineseDiv.innerHTML = highlightCharacters(line);
                }
                lineContainer.appendChild(chineseDiv);
                
                // Pinyin
                if (version.pinyin && version.pinyin[index]) {
                    const pinyinDiv = document.createElement('div');
                    pinyinDiv.className = `pinyin-line ${isEditMode ? 'editable' : ''}`;
                    if (isEditMode) {
                        pinyinDiv.contentEditable = true;
                        pinyinDiv.onblur = () => updateChapterLine('pinyin', index, pinyinDiv.textContent);
                    }
                    pinyinDiv.textContent = version.pinyin[index];
                    lineContainer.appendChild(pinyinDiv);
                }
                
                originalContainer.appendChild(lineContainer);
                
                // Structural translation
                const structuralContainer = document.createElement('div');
                structuralContainer.className = 'line-container';
                
                const structuralDiv = document.createElement('div');
                structuralDiv.className = `structural-line ${isEditMode ? 'editable' : ''}`;
                if (isEditMode) {
                    structuralDiv.contentEditable = true;
                    structuralDiv.onblur = () => updateChapterLine('structural', index, structuralDiv.textContent);
                }
                structuralDiv.textContent = chapter.structural[index] || '';
                structuralContainer.appendChild(structuralDiv);
                
                document.getElementById('structuralText').appendChild(structuralContainer);
            });
        }

        function highlightCharacters(text) {
            let highlighted = text;
            
            // Sort by length (longest first) to avoid partial matches
            const sortedChars = Object.keys(characterMappings).sort((a, b) => b.length - a.length);
            
            sortedChars.forEach(char => {
                const data = characterMappings[char];
                const regex = new RegExp(char, 'g');
                highlighted = highlighted.replace(regex, 
                    `<span class="highlighted-char">${char}<div class="char-tooltip">${data.pinyin || ''}<br>${data.meaning || ''}</div></span>`);
            });
            
            return highlighted;
        }

        function updateChapterLine(type, index, value) {
            const chapter = chapters[currentChapter];
            if (!chapter) return;
            
            if (type === 'structural') {
                if (!chapter.structural) chapter.structural = [];
                chapter.structural[index] = value;
            } else {
                const version = chapter.versions[currentVersion];
                if (!version) return;
                
                if (type === 'chinese') {
                    version.chinese[index] = value;
                } else if (type === 'pinyin') {
                    if (!version.pinyin) version.pinyin = [];
                    version.pinyin[index] = value;
                }
            }
        }

        function updateMappingPinyin(char, newPinyin) {
            if (!characterMappings[char]) characterMappings[char] = {};
            characterMappings[char].pinyin = newPinyin;
            renderCurrentChapter();
        }

        function updateMappingMeaning(char, newMeaning) {
            if (!characterMappings[char]) characterMappings[char] = {};
            characterMappings[char].meaning = newMeaning;
            
            // Auto-update structural translations
            autoUpdateStructuralTranslations(char);
            renderCurrentChapter();
            updateLexicon();
        }

        function deleteMapping(char) {
            delete characterMappings[char];
            renderMappingsList();
            renderCurrentChapter();
        }

        function addMapping() {
            const charInput = document.getElementById('newChar');
            const pinyinInput = document.getElementById('newPinyin');
            const meaningInput = document.getElementById('newMapping');
            
            const char = charInput.value.trim();
            const pinyin = pinyinInput.value.trim();
            const meaning = meaningInput.value.trim();
            
            if (char && meaning) {
                characterMappings[char] = {
                    pinyin: pinyin,
                    meaning: meaning
                };
                charInput.value = '';
                pinyinInput.value = '';
                meaningInput.value = '';
                
                // Auto-update structural translations if this character exists in current chapter
                autoUpdateStructuralTranslations(char);
                
                renderMappingsList();
                renderCurrentChapter();
                updateLexicon();
            }
        }

        function autoUpdateStructuralTranslations(changedChar) {
            const chapter = chapters[currentChapter];
            if (!chapter) return;
            
            const version = chapter.versions[currentVersion] || chapter.versions.traditional || chapter.versions[Object.keys(chapter.versions)[0]];
            if (!version || !version.chinese) return;
            
            // Check if this character appears in the current chapter
            const chapterText = version.chinese.join('');
            if (!chapterText.includes(changedChar)) return;
            
            // Auto-generate structural translations based on character mappings
            version.chinese.forEach((line, index) => {
                if (line.includes(changedChar)) {
                    const autoTranslation = generateAutoTranslation(line);
                    if (autoTranslation && (!chapter.structural[index] || chapter.structural[index].startsWith('[Auto]'))) {
                        chapter.structural[index] = `[Auto] ${autoTranslation}`;
                    }
                }
            });
        }

        function generateAutoTranslation(chineseLine) {
            // Simple auto-translation based on character mappings
            let translation = '';
            
            // Replace known characters with their structural meanings
            let remaining = chineseLine;
            const sortedChars = Object.keys(characterMappings).sort((a, b) => b.length - a.length);
            
            for (const char of sortedChars) {
                if (remaining.includes(char)) {
                    const meaning = characterMappings[char].meaning;
                    if (meaning) {
                        remaining = remaining.replace(new RegExp(char, 'g'), `{${meaning}}`);
                    }
                }
            }
            
            // Clean up and format
            translation = remaining.replace(/[{}]/g, '').replace(/\s+/g, ' ').trim();
            
            return translation || null;
        }

        function updateLexicon() {
            const chapter = chapters[currentChapter];
            if (!chapter) return;
            
            const version = chapter.versions[currentVersion] || chapter.versions.traditional || chapter.versions[Object.keys(chapter.versions)[0]];
            if (!version || !version.chinese) return;
            
            // Extract characters from current chapter
            chapterLexicon = {};
            const chapterText = version.chinese.join('');
            
            // Count character frequencies
            for (const char of chapterText) {
                if (char.match(/[\u4e00-\u9fff]/)) { // Chinese characters only
                    chapterLexicon[char] = (chapterLexicon[char] || 0) + 1;
                }
            }
            
            // Also check for multi-character terms
            Object.keys(characterMappings).forEach(term => {
                if (term.length > 1 && chapterText.includes(term)) {
                    const matches = (chapterText.match(new RegExp(term, 'g')) || []).length;
                    chapterLexicon[term] = matches;
                }
            });
            
            renderLexicon();
        }

        function renderLexicon() {
            const container = document.getElementById('lexiconList');
            const statsElement = document.getElementById('lexiconStats');
            
            container.innerHTML = '';
            
            // Sort by frequency (descending) then by character
            const sortedChars = Object.keys(chapterLexicon).sort((a, b) => {
                const freqDiff = chapterLexicon[b] - chapterLexicon[a];
                return freqDiff !== 0 ? freqDiff : a.localeCompare(b);
            });
            
            statsElement.textContent = `${sortedChars.length} characters in Chapter ${currentChapter}`;
            
            sortedChars.forEach(char => {
                const frequency = chapterLexicon[char];
                const mapping = characterMappings[char];
                const isAutoTranslated = !mapping;
                
                const item = document.createElement('div');
                item.className = `lexicon-item ${isAutoTranslated ? 'auto-translation' : ''}`;
                
                const charDiv = document.createElement('div');
                charDiv.className = 'lexicon-char';
                charDiv.textContent = char;
                
                const pinyinDiv = document.createElement('div');
                pinyinDiv.className = 'lexicon-pinyin';
                pinyinDiv.textContent = mapping ? mapping.pinyin || '' : '';
                
                const meaningDiv = document.createElement('div');
                meaningDiv.className = 'lexicon-meaning';
                if (mapping) {
                    meaningDiv.textContent = mapping.meaning || 'No definition';
                } else {
                    meaningDiv.innerHTML = `<em>No mapping defined</em> <button class="add-btn" style="font-size: 10px; padding: 2px 6px; margin-left: 8px;" onclick="quickAddMapping('${char}')">+ Add</button>`;
                }
                
                const frequencyDiv = document.createElement('div');
                frequencyDiv.className = 'lexicon-frequency';
                frequencyDiv.textContent = `Used ${frequency}x`;
                
                item.appendChild(charDiv);
                if (pinyinDiv.textContent) item.appendChild(pinyinDiv);
                item.appendChild(meaningDiv);
                item.appendChild(frequencyDiv);
                
                container.appendChild(item);
            });
        }

        function quickAddMapping(char) {
            const pinyin = prompt(`Enter pinyin for ${char}:`);
            const meaning = prompt(`Enter structural meaning for ${char}:`);
            
            if (meaning) {
                characterMappings[char] = {
                    pinyin: pinyin || '',
                    meaning: meaning
                };
                
                autoUpdateStructuralTranslations(char);
                renderMappingsList();
                renderCurrentChapter();
                updateLexicon();
            }
        }

        function toggleLexiconMode() {
            lexiconMode = lexiconMode === 'auto' ? 'manual' : 'auto';
            document.getElementById('lexiconModeText').textContent = 
                lexiconMode === 'auto' ? 'Auto Mode' : 'Manual Mode';
            updateLexicon();
        }

        function exportLexicon() {
            const lexiconData = {
                chapter: currentChapter,
                version: currentVersion,
                characters: chapterLexicon,
                mappings: {},
                exported: new Date().toISOString()
            };
            
            // Include mappings for characters in this chapter
            Object.keys(chapterLexicon).forEach(char => {
                if (characterMappings[char]) {
                    lexiconData.mappings[char] = characterMappings[char];
                }
            });
            
            const blob = new Blob([JSON.stringify(lexiconData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lexicon_chapter_${currentChapter}_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function addNewChapter() {
            const input = document.getElementById('newChapterNum');
            const chapterNum = input.value.trim();
            
            if (chapterNum && !chapters[chapterNum]) {
                chapters[chapterNum] = {
                    versions: {
                        traditional: {
                            chinese: [''],
                            pinyin: ['']
                        }
                    },
                    structural: ['']
                };
                input.value = '';
                currentChapter = chapterNum;
                renderChapterButtons();
                renderCurrentChapter();
            }
        }

        function deleteCurrentChapter() {
            if (Object.keys(chapters).length <= 1) {
                alert('Cannot delete the last chapter');
                return;
            }
            
            if (confirm(`Delete Chapter ${currentChapter}?`)) {
                delete chapters[currentChapter];
                currentChapter = Object.keys(chapters)[0];
                renderChapterButtons();
                renderCurrentChapter();
            }
        }

        function exportMappings() {
            const data = {
                mappings: characterMappings,
                chapters: chapters,
                currentChapter: currentChapter,
                currentVersion: currentVersion,
                exported: new Date().toISOString(),
                version: '2.0'
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tao_translation_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importMappings(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.mappings) {
                        // Merge mappings
                        Object.keys(data.mappings).forEach(char => {
                            characterMappings[char] = data.mappings[char];
                        });
                    }
                    
                    if (data.chapters) {
                        // Merge chapters
                        Object.keys(data.chapters).forEach(chapterNum => {
                            chapters[chapterNum] = data.chapters[chapterNum];
                        });
                    }
                    
                    if (data.currentChapter && chapters[data.currentChapter]) {
                        currentChapter = data.currentChapter;
                    }
                    
                    if (data.currentVersion) {
                        currentVersion = data.currentVersion;
                        document.getElementById('versionSelector').value = currentVersion;
                    }
                    
                    renderChapterButtons();
                    renderMappingsList();
                    renderCurrentChapter();
                    
                    alert('Import successful!');
                } catch (error) {
                    alert('Error importing file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // Search functionality
        document.getElementById('charSearch').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const mappingItems = document.querySelectorAll('.mapping-item');
            
            mappingItems.forEach(item => {
                const char = item.querySelector('.chinese-char').textContent;
                const pinyin = item.querySelector('.pinyin-input').value.toLowerCase();
                const meaning = item.querySelector('.mapping-input').value.toLowerCase();
                
                if (char.includes(searchTerm) || pinyin.includes(searchTerm) || meaning.includes(searchTerm)) {
                    item.style.display = 'grid';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 'e':
                        e.preventDefault();
                        toggleEditMode();
                        break;
                    case 's':
                        e.preventDefault();
                        exportMappings();
                        break;
                    case 'o':
                        e.preventDefault();
                        document.getElementById('fileInput').click();
                        break;
                }
            }
            
            // Chapter navigation
            if (e.altKey && !isNaN(e.key) && e.key !== '') {
                const chapterKeys = Object.keys(chapters).sort((a, b) => parseInt(a) - parseInt(b));
                const index = parseInt(e.key) - 1;
                if (chapterKeys[index]) {
                    selectChapter(chapterKeys[index]);
                }
            }
        });

        // Auto-save to localStorage
        function autoSave() {
            const data = {
                mappings: characterMappings,
                chapters: chapters,
                currentChapter: currentChapter,
                currentVersion: currentVersion,
                lastSaved: new Date().toISOString()
            };
            localStorage.setItem('taoTranslator', JSON.stringify(data));
        }

        function autoLoad() {
            const saved = localStorage.getItem('taoTranslator');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.mappings) {
                        Object.assign(characterMappings, data.mappings);
                    }
                    if (data.chapters) {
                        Object.assign(chapters, data.chapters);
                    }
                    if (data.currentChapter) {
                        currentChapter = data.currentChapter;
                    }
                    if (data.currentVersion) {
                        currentVersion = data.currentVersion;
                        document.getElementById('versionSelector').value = currentVersion;
                    }
                } catch (error) {
                    console.warn('Could not load auto-saved data:', error);
                }
            }
        }

        // Auto-save every 30 seconds
        setInterval(autoSave, 30000);

        // Load auto-saved data on startup
        autoLoad();

        // Initialize the app
        initializeApp();
    </script>
</body>
</html>
